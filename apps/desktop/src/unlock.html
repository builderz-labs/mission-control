<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to Mission Control</title>
  <style>
    :root { color-scheme: dark; font: 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #f4f4f5; background: #09090b; display: grid; place-items: center; }
    main { width: 100%; padding: 34px 42px 30px; text-align: center; }
    .mark { width: 58px; height: 58px; margin: 0 auto 22px; border: 1px solid #2c313c; border-radius: 16px;
      display: grid; place-items: center; background: linear-gradient(145deg, #181b22, #0d0f13); font-weight: 750; letter-spacing: .08em; }
    h1 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
    .lede { margin: 10px auto 24px; max-width: 310px; color: #a1a1aa; line-height: 1.55; }
    button, input { width: 100%; height: 48px; border-radius: 10px; font: inherit; }
    button { border: 1px solid #343842; color: #fafafa; background: #1a1d24; cursor: pointer; font-weight: 650; }
    button:hover { background: #232730; border-color: #4a505d; }
    button:focus-visible, input:focus-visible { outline: 2px solid #22d3ee; outline-offset: 2px; }
    button:disabled, input:disabled { opacity: .55; cursor: wait; }
    .primary { color: #041013; border-color: #22d3ee; background: #22d3ee; }
    .primary:hover { background: #67e8f9; border-color: #67e8f9; }
    .separator { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: #71717a; font-size: 12px; }
    .separator::before, .separator::after { content: ""; height: 1px; flex: 1; background: #27272a; }
    form { display: grid; grid-template-columns: 1fr 104px; gap: 10px; }
    input { border: 1px solid #343842; color: #fafafa; background: #101217; padding: 0 16px; text-align: center;
      font-size: 20px; letter-spacing: .45em; font-variant-numeric: tabular-nums; }
    form button { width: 104px; }
    #message { min-height: 42px; margin: 18px 0 2px; color: #a1a1aa; line-height: 1.45; font-size: 13px; }
    .link { height: 36px; border: 0; color: #a1a1aa; background: transparent; font-weight: 500; }
    .link:hover { color: #fafafa; background: transparent; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">MC</div>
    <h1>Welcome back</h1>
    <p class="lede">Unlock the local Mission Control desktop app.</p>
    <button class="primary" id="touch-id" type="button">Use Touch ID</button>
    <div class="separator" id="separator">or use PIN</div>
    <form id="pin-form">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}"
        aria-label="Four-digit PIN" placeholder="••••">
      <button type="submit">Unlock</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <button class="link" id="account-login" type="button">Use account login</button>
  </main>
  <script type="module" src="./unlock-renderer.mjs"></script>
</body>
</html>
