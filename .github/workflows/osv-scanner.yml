name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml
      upload-sarif: true
      fail-on-vuln: true
