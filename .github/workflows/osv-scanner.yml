name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Inlined from google/osv-scanner-action's osv-scanner-reusable-pr.yml (v2.3.8)
# without its "Export results" step. That step copies both full scan results
# into job outputs, which exceeds GitHub's 1 MB job-output limit for this
# lockfile and failed every PR run. Behaviour is otherwise unchanged: scan the
# base branch and the PR, and fail only on vulnerabilities the PR introduces.
jobs:
  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout target branch
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: git checkout "${BASE_REF#refs/heads/}"
      - name: Run scanner on existing code
        uses: google/osv-scanner-action/osv-scanner-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            --lockfile=./pnpm-lock.yaml
      - name: Checkout current branch
        run: git checkout -f "$GITHUB_SHA"
      - name: Run scanner on new code
        uses: google/osv-scanner-action/osv-scanner-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            --lockfile=./pnpm-lock.yaml
      - name: Run osv-scanner-reporter
        uses: google/osv-scanner-action/osv-reporter-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # v2.3.8
        with:
          scan-args: |-
            --output=results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true
      - name: Upload SARIF artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OSV Scanner SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
